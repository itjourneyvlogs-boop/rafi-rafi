<!DOCTYPE html>
<html>
<head>
    <title>Gatepass Entry - NSSH</title>
    <style>
    body { font-family:Arial; background:#f4f6f9; padding:20px; }
    .form-box { max-width:800px; margin:auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
    input, select, textarea { width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:6px; }
    button { background:#00bcd4; color:white; padding:14px; width:100%; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
    </style>
</head>
<body>
<h2>🆔 New Gatepass - NSSH</h2>

<div class="form-box">
<form id="gatepassForm">
    <label>Block</label>
    <input type="text" value="NSSH" readonly>

    <label>Gatepass No</label>
    <input type="text" id="gatepassNo" required>

    <label>Person Name</label>
    <input type="text" id="personName" required>

    <label>Purpose</label>
    <textarea id="purpose" rows="3"></textarea>

    <label>Destination</label>
    <input type="text" id="destination" required>

    <label>Status</label>
    <select id="status">
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
    </select>

    <button type="submit">Save Gatepass</button>
</form>
</div>

<script>
document.getElementById("gatepassForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const data = {
        gatepassNo: document.getElementById("gatepassNo").value,
        personName: document.getElementById("personName").value,
        purpose: document.getElementById("purpose").value,
        destination: document.getElementById("destination").value,
        status: document.getElementById("status").value,
        block: "NSSH"
    };

    let gates = JSON.parse(localStorage.getItem("gatepass_NSSH")) || [];
    gates.push(data);
    localStorage.setItem("gatepass_NSSH", JSON.stringify(gates));

    alert("✅ Gatepass Saved!");
    this.reset();
});
</script>
</body>
</html>
