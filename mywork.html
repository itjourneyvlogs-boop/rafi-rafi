<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work - NSSH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f6f9; 
            padding: 20px; 
            margin: 0;
        }
        .form-box { 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
        }
        h2 { color: #00bcd4; text-align: center; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            font-size: 16px;
        }
        button { 
            background: #00bcd4; 
            color: white; 
            padding: 14px; 
            width: 100%; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #0097a7; }
        .dashboard-btn {
            position: absolute; 
            top: 20px; 
            right: 20px; 
            padding: 10px 20px; 
            background: #00bcd4; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
    </style>
</head>
<body>

<button onclick="goToDashboard()" class="dashboard-btn">
    <i class="fas fa-home"></i> Dashboard
</button>

<h2>📝 Daily Work Entry - NSSH</h2>

<div class="form-box">
    <form id="workForm">
        <label>S.No</label>
        <input type="number" id="sno" required>

        <label>Date</label>
        <input type="date" id="date" required>

        <label>Time</label>
        <input type="time" id="time" required>

        <label>Block Name</label>
        <select id="block" required>
            <option value="NSSH">NSSH</option>
        </select>

        <label>Department</label>
        <input type="text" id="dept">

        <label>Floor</label>
        <input type="text" id="floor">

        <label>Problem</label>
        <textarea id="problem" rows="4" placeholder="వివరంగా రాయండి..."></textarea>

        <label>Ticket No</label>
        <input type="text" id="ticket">

        <label>Status</label>
        <select id="status">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">✅ Save Work</button>
    </form>
</div>

<script type="module">
    // ==================== Firebase Configuration ====================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY_HERE",
        authDomain: "nssh-it-system.firebaseapp.com",
        projectId: "nssh-it-system",
        storageBucket: "nssh-it-system.firebasestorage.app",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("workForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const formData = {
            sno: parseInt(document.getElementById("sno").value),
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            block: "NSSH",
            dept: document.getElementById("dept").value,
            floor: document.getElementById("floor").value,
            problem: document.getElementById("problem").value,
            ticket: document.getElementById("ticket").value,
            status: document.getElementById("status").value,
            timestamp: new Date().toISOString()
        };

        try {
            await addDoc(collection(db, "works_NSSH"), formData);
            alert("✅ Work Saved Successfully!");
            this.reset();
        } catch (error) {
            console.error("Error:", error);
            alert("❌ Error saving data: " + error.message);
        }
    });

    function goToDashboard() {
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
