<!DOCTYPE html>
<html>
<head>
    <title>Gatepass View - NSSH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { font-family:Arial; background:#f4f6f9; padding:20px; position:relative; }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#00bcd4; color:white; }
    </style>
</head>
<body>

<button onclick="goToDashboard()" style="position:absolute; top:20px; right:20px; padding:10px 20px; background:#00bcd4; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">
    <i class="fas fa-home"></i> Dashboard
</button>

<h2>NSSH - Gatepass Records</h2>

<table id="dataTable">
    <thead>
        <tr>
            <th>Gatepass No</th>
            <th>Person</th>
            <th>Purpose</th>
            <th>Destination</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script type="module">
import { db, collection, getDocs, deleteDoc, doc, onSnapshot } from "./firebase.js";

const gatepassRef = collection(db, "gatepass_NSSH");

let allData = [];

function renderTable() {
    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = "";
    allData.forEach((item) => {
        tbody.innerHTML += `
            <tr>
                <td>${item.gatepassNo}</td>
                <td>${item.personName}</td>
                <td>${item.purpose}</td>
                <td>${item.destination}</td>
                <td>${item.status}</td>
                <td><button onclick="deleteGate('${item.id}')">Delete</button></td>
            </tr>`;
    });
}

// Real-time Listener
onSnapshot(gatepassRef, (snapshot) => {
    allData = [];
    snapshot.forEach((docSnap) => {
        allData.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderTable();
});

async function deleteGate(id) {
    if(confirm("Delete this Gatepass?")) {
        await deleteDoc(doc(db, "gatepass_NSSH", id));
    }
}

function goToDashboard() {
    window.location.href = "dashboard.html";
}
</script>
</body>
</html>
