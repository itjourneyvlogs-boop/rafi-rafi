<!DOCTYPE html>
<html>
<head>
    <title>Secure Login - NSSH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        background: url('bg.jpg') no-repeat center center/cover;
        position: relative;
    }
   
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.65);
        z-index: -1;
    }

    .login-box {
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(16px);
        padding: 60px 40px;     /* ఇక్కడ height పెరిగింది */
        border-radius: 25px;
        width: 420px;
        min-height: 520px;      /* Minimum height increased */
        text-align: center;
        box-shadow: 0 0 50px rgba(0, 229, 255, 0.7),
                    0 0 90px rgba(138, 43, 226, 0.5);
        border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .lock-icon {
        font-size: 70px;
        color: #00e5ff;
        margin-bottom: 20px;
        text-shadow: 0 0 30px #00e5ff;
        animation: pulse 2s infinite;
    }

    h2 { 
        color: #00e5ff; 
        margin-bottom: 10px; 
        font-size: 32px; 
        text-shadow: 0 0 20px #00e5ff;
    }

    .subtitle { color: #a5b4fc; margin-bottom: 30px; font-size: 18px; }

    input, #captchaInput {
        width: 100%;
        padding: 16px 20px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(0, 229, 255, 0.4);
        border-radius: 12px;
        color: white;
        font-size: 17px;
        margin: 12px 0;
    }
    input:focus, #captchaInput:focus {
        border-color: #00e5ff;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
    }

    .captcha-container {
        background: rgba(255,255,255,0.1);
        padding: 12px;
        border-radius: 12px;
        margin: 15px 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #captchaCode {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 4px;
        color: #00ff88;
        background: rgba(0,0,0,0.4);
        padding: 8px 15px;
        border-radius: 8px;
    }

    button {
        width: 100%;
        padding: 16px;
        margin: 25px 0 10px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        background: linear-gradient(135deg, #00bcd4, #7b00ff);
        color: white;
        box-shadow: 0 0 30px rgba(0, 188, 212, 0.7);
        cursor: pointer;
    }
    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(123, 0, 255, 0.8);
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
    }
    </style>
</head>
<body>

<div class="login-box">
    <i class="fas fa-lock lock-icon"></i>
    <h2>🔐 Secure Login</h2>
    <p class="subtitle">NSSH IT Work Management System</p>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <!-- CAPTCHA -->
    <div class="captcha-container">
        <span id="captchaCode"></span>
        <input type="text" id="captchaInput" placeholder="Enter CAPTCHA" style="width:160px; margin:0;">
        <button type="button" onclick="refreshCaptcha()" style="width:auto; padding:8px 12px; font-size:14px;">⟳</button>
    </div>

    <button onclick="login()">LOGIN</button>
</div>

<script>
// CAPTCHA Logic
let captchaAnswer = 0;

function generateCaptcha() {
    const num1 = Math.floor(Math.random() * 10) + 1;
    const num2 = Math.floor(Math.random() * 10) + 1;
    captchaAnswer = num1 + num2;
    document.getElementById("captchaCode").textContent = `${num1} + ${num2} = ?`;
}

function refreshCaptcha() {
    generateCaptcha();
    document.getElementById("captchaInput").value = "";
}

function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const captchaInput = parseInt(document.getElementById("captchaInput").value.trim());

    if (!user || !pass) {
        alert("Please enter username and password!");
        return;
    }

    if (captchaInput !== captchaAnswer) {
        alert("❌ Wrong CAPTCHA! Please try again.");
        refreshCaptcha();
        return;
    }

    if (user === "admin" && pass === "admin123") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        alert("Invalid credentials!");
        refreshCaptcha();
    }
}

window.onload = () => {
    generateCaptcha();
    document.getElementById("password").addEventListener("keypress", (e) => { if (e.key === "Enter") login(); });
    document.getElementById("captchaInput").addEventListener("keypress", (e) => { if (e.key === "Enter") login(); });
};
</script>
</body>
</html>
