<!DOCTYPE html>
<html>
<head>
    <title>Secure Login - NSSH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        background: url('bg.jpg') no-repeat center center/cover;
        position: relative;
    }
    
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.65);
        z-index: -1;
    }

    .login-box {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        padding: 50px 40px;
        border-radius: 25px;
        width: 400px;
        text-align: center;
        box-shadow: 0 0 50px rgba(0, 229, 255, 0.7),
                    0 0 90px rgba(138, 43, 226, 0.5);
        border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .lock-icon {
        font-size: 65px;
        color: #00e5ff;
        margin-bottom: 15px;
        text-shadow: 0 0 30px #00e5ff;
        animation: pulse 2s infinite;
    }

    h2 { 
        color: #00e5ff; 
        margin-bottom: 8px; 
        font-size: 32px; 
        text-shadow: 0 0 20px #00e5ff;
    }

    .subtitle { color: #a5b4fc; margin-bottom: 30px; font-size: 18px; }

    input {
        width: 100%;
        padding: 16px 20px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(0, 229, 255, 0.4);
        border-radius: 12px;
        color: white;
        font-size: 17px;
        margin: 12px 0;
    }
    input:focus {
        border-color: #00e5ff;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
    }

    button {
        width: 100%;
        padding: 16px;
        margin: 25px 0 10px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        background: linear-gradient(135deg, #00bcd4, #7b00ff);
        color: white;
        box-shadow: 0 0 30px rgba(0, 188, 212, 0.7);
        cursor: pointer;
    }
    button:hover {
        transform: scale(1.06);
        box-shadow: 0 0 40px rgba(123, 0, 255, 0.8);
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
    }
    </style>
</head>
<body>

<div class="login-box">
    <i class="fas fa-lock lock-icon"></i>
    <h2>🔐 Secure Login</h2>
    <p class="subtitle">NSSH IT Work Management System</p>

    <input type="text" id="username" placeholder="Username" value="admin">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>
    <small style="color:#94a3b8;">Default: admin / admin123</small>
</div>

<script>
function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    
    if (user === "admin" && pass === "admin123") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        alert("Invalid credentials!");
    }
}

document.getElementById("password").addEventListener("keypress", (e) => {
    if (e.key === "Enter") login();
});
</script>
</body>
</html>
