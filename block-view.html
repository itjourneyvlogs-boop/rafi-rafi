<!DOCTYPE html>
<html>
<head>
    <title>Block View - NSSH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { font-family:Arial; background:#f4f6f9; padding:20px; position:relative; }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#00bcd4; color:white; }
    button { padding:8px 15px; margin:5px; border:none; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>

<!-- Back to Dashboard -->
<button onclick="goToDashboard()" style="position:absolute; top:20px; right:20px; padding:10px 20px; background:#00bcd4; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">
    <i class="fas fa-home"></i> Dashboard
</button>

<h2>NSSH - Work Data</h2>

<table id="dataTable">
    <thead>
        <tr>
            <th>S.No</th><th>Date</th><th>Time</th><th>Problem</th><th>Status</th><th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let allData = [];

function loadData() {
    allData = JSON.parse(localStorage.getItem("works_NSSH")) || [];
    renderTable();
}

function renderTable() {
    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = "";
    allData.forEach((item, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${item.sno}</td>
                <td>${item.date}</td>
                <td>${item.time}</td>
                <td>${item.problem}</td>
                <td>${item.status}</td>
                <td><button onclick="deleteRow(${index})">Delete</button></td>
            </tr>`;
    });
}

function deleteRow(index) {
    if(confirm("Delete this record?")) {
        allData.splice(index,1);
        localStorage.setItem("works_NSSH", JSON.stringify(allData));
        renderTable();
    }
}

function goToDashboard() {
    window.location.href = "dashboard.html";
}

window.onload = loadData;
</script>
</body>
</html>
