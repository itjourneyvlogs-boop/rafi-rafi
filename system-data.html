<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    body { font-family:Arial; background:linear-gradient(135deg,#1e3c72,#2a5298); color:white; padding:20px; position:relative; }
    .block-card { background:rgba(255,255,255,0.15); padding:30px; border-radius:15px; text-align:center; max-width:500px; margin:30px auto; }
    .btn { padding:12px; margin:5px; border:none; border-radius:8px; width:48%; cursor:pointer; }

</head>
<body>

<button onclick="goToDashboard()" style="position:absolute; top:20px; right:20px; padding:10px 20px; background:#00bcd4; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">

    <button class="btn view-btn" onclick="viewSystem()">👁 View Systems</button>

<script>
function enterSystem() { 
    window.location.href = 'system-form.html'; 
}

function viewSystem() {

</script>

</html>
