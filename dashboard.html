<!DOCTYPE html>
<html>
<head>
    <title>NSSH Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
    body { margin:0; font-family:Arial; background:linear-gradient(135deg,#0f1c3a,#1e3c72,#2a5298); color:white; }
    header { text-align:center; padding:25px; font-size:32px; font-weight:bold; text-shadow:0 0 15px #00e5ff; }
    .search-container { text-align:center; margin:20px auto; max-width:700px; }
    #searchInput { width:90%; padding:16px; font-size:18px; border-radius:50px; border:none; background:rgba(255,255,255,0.95); color:#333; }
    
    .chart-box { width:420px; margin:30px auto; background:rgba(255,255,255,0.12); padding:20px; border-radius:20px; backdrop-filter:blur(10px); }
    
    .container { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; padding:20px 30px; }
    .card { background:rgba(255,255,255,0.15); border-radius:16px; padding:20px; text-align:center; cursor:pointer; transition:0.3s; }
    .card:hover { transform:translateY(-10px); box-shadow:0 0 25px #00e5ff; }
    .card i { font-size:48px; margin-bottom:8px; }
    
    .logout-btn { position:absolute; top:20px; right:20px; background:#f44336; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body>

<header>🚀 NSSH IT Work Management Dashboard</header>

<button class="logout-btn" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i> Logout
</button>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Global Search...">
</div>

<div class="chart-box">
    <canvas id="myChart" height="180"></canvas>
</div>

<div class="container">
    <div class="card" onclick="openPage('My Work')"><i class="fas fa-briefcase" style="color:#00e5ff"></i><h3>My Work</h3></div>
    <div class="card" onclick="openPage('Blocks')"><i class="fas fa-building" style="color:#ffcc00"></i><h3>Blocks</h3></div>
    <div class="card" onclick="openPage('Indents')"><i class="fas fa-file-invoice" style="color:#00ff88"></i><h3>Indents</h3></div>
    <div class="card" onclick="openPage('Gatepass')"><i class="fas fa-id-badge" style="color:#ff66cc"></i><h3>Gatepass</h3></div>
    <div class="card" onclick="openPage('System Data')"><i class="fas fa-desktop" style="color:#ffff00"></i><h3>System Data</h3></div>
    <div class="card" onclick="openPage('Pending Works')"><i class="fas fa-hourglass-half" style="color:#ff9966"></i><h3>Pending</h3></div>
    <div class="card" onclick="openPage('My Documents')"><i class="fas fa-folder-open" style="color:#ff9800"></i><h3>My Documents</h3></div>
</div>

<script>
    // Non-module script to avoid import issues for now
    let myChart;

    async function updateChart() {
        try {
            // Simple fallback - show chart without Firebase for now
            const ctx = document.getElementById('myChart');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Works', 'Indents', 'Gatepass', 'Systems'],
                    datasets: [{
                        data: [12, 5, 8, 15],
                        backgroundColor: ['#00e5ff', '#00ff88', '#ff66cc', '#ffff00']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom', labels: { color: 'white' }}}
                }
            });
        } catch(e) {}
    }

    function openPage(page) {
        const urls = {
            "My Work": "mywork.html",
            "Blocks": "blocks.html",
            "Indents": "indents.html",
            "Gatepass": "gatepass.html",
            "System Data": "system-data.html",
            "Pending Works": "view.html",
            "My Documents": "my-documents.html"
        };
        if (urls[page]) {
            window.location.href = urls[page];
        }
    }

    function logout() {
        if(confirm("Logout చేయాలనుకుంటున్నారా?")) {
            localStorage.removeItem("loggedIn");
            window.location.href = "index.html";
        }
    }

    // Initialize
    window.onload = function() {
        updateChart();
    };
</script>
</body>
</html>
