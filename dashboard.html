<script type="module">
import { db, collection, getDocs, onSnapshot } from "./firebase.js";

let myChart;

// Improved Chart with Real-time
async function updateChart() {
    try {
        const worksRef = collection(db, "works_NSSH");
        const indentsRef = collection(db, "indents_NSSH");
        const gatepassRef = collection(db, "gatepass_NSSH");
        const systemRef = collection(db, "system_NSSH");

        const [w, i, g, s] = await Promise.all([
            getDocs(worksRef),
            getDocs(indentsRef),
            getDocs(gatepassRef),
            getDocs(systemRef)
        ]);

        const works = w.size;
        const indents = i.size;
        const gates = g.size;
        const systems = s.size;

        const ctx = document.getElementById('myChart');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Works', 'Indents', 'Gatepass', 'Systems'],
                datasets: [{
                    data: [works, indents, gates, systems],
                    backgroundColor: ['#00e5ff', '#00ff88', '#ff66cc', '#ffff00'],
                    borderWidth: 2,
                    borderColor: '#1e3c72'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: 'white', font: { size: 14 } }
                    }
                }
            }
        });
    } catch (error) {
        console.error("Chart Error:", error);
    }
}

// Fixed Navigation
function openPage(page) {
    const urls = {
        "My Work": "mywork.html",
        "Blocks": "blocks.html",
        "Indents": "indents.html",
        "Gatepass": "gatepass.html",
        "System Data": "system-data.html",
        "Pending Works": "view.html",
        "My Documents": "my-documents.html"
    };

    if (urls[page]) {
        window.location.href = urls[page];
    } else {
        alert("🚧 " + page + " - Coming Soon");
    }
}

function logout() {
    if (confirm("Logout చేయాలనుకుంటున్నారా?")) {
        localStorage.removeItem("loggedIn");
        window.location.href = "index.html";
    }
}

// Real-time Updates
function startRealTimeUpdates() {
    updateChart();
    
    // Auto refresh every 8 seconds
    setInterval(() => {
        updateChart();
    }, 8000);
}

// Initialize everything
window.onload = function() {
    startRealTimeUpdates();
    
    // Search functionality (basic)
    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
        searchInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                const query = this.value.trim().toLowerCase();
                if (query) {
                    alert("🔍 Searching for: " + query + "\n(Full search coming soon)");
                }
            }
        });
    }
};
</script>
