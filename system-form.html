<!DOCTYPE html>
<html>
<head>
    <title>New System - NSSH</title>
    <style>
    body { font-family:Arial; background:#f4f6f9; padding:20px; }
    .form-box { max-width:900px; margin:auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
    input, select, textarea { width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:6px; }
    button { background:#00bcd4; color:white; padding:14px; width:100%; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
    </style>
</head>
<body>
<h2>🖥️ New System / Equipment - NSSH</h2>

<div class="form-box">
<form id="systemForm">
    <label>Block</label>
    <input type="text" value="NSSH" readonly>

    <label>Equipment Name / Hostname</label>
    <input type="text" id="equipmentName" required>

    <label>IP Address</label>
    <input type="text" id="ip">

    <label>Status</label>
    <select id="status">
        <option value="Working">Working</option>
        <option value="Under Repair">Under Repair</option>
    </select>

    <button type="submit">Save System</button>
</form>
</div>

<script>
document.getElementById("systemForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const data = {
        equipmentName: document.getElementById("equipmentName").value,
        ip: document.getElementById("ip").value,
        status: document.getElementById("status").value,
        block: "NSSH"
    };

    let systems = JSON.parse(localStorage.getItem("system_NSSH")) || [];
    systems.push(data);
    localStorage.setItem("system_NSSH", JSON.stringify(systems));

    alert("✅ System Data Saved!");
    this.reset();
});
</script>
</body>
</html>
